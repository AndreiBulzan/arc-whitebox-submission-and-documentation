<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">The submitted estimator at a glance</title>
  <desc id="desc">A complete structured angular design passes through the fixed 32-layer network and produces 256 expected activations.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5942a9"/>
      <stop offset="0.52" stop-color="#a55786"/>
      <stop offset="1" stop-color="#c7835f"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7cc6b8" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#6c55aa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6c55aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a718f"/>
    </marker>
  </defs>

  <g transform="translate(155 139)">
    <circle r="102" fill="url(#orb)"/>
    <ellipse rx="103" ry="42" fill="none" stroke="#7158ad" stroke-width="1.4" opacity="0.36"/>
    <ellipse rx="103" ry="42" transform="rotate(58)" fill="none" stroke="#9f5b88" stroke-width="1.4" opacity="0.28"/>
    <ellipse rx="103" ry="42" transform="rotate(-58)" fill="none" stroke="#c17c64" stroke-width="1.4" opacity="0.25"/>
    <g stroke="url(#flow)" stroke-width="1.15" opacity="0.48">
      <line x1="-88" y1="-47" x2="88" y2="47"/>
      <line x1="-70" y1="67" x2="70" y2="-67"/>
      <line x1="-22" y1="-96" x2="22" y2="96"/>
      <line x1="-99" y1="15" x2="99" y2="-15"/>
    </g>
    <g fill="#684fa8">
      <circle cx="-88" cy="-47" r="4.8"/><circle cx="70" cy="-67" r="4.8"/>
      <circle cx="-22" cy="-96" r="4.8"/><circle cx="-99" cy="15" r="4.8"/>
    </g>
    <g fill="#c47763">
      <circle cx="88" cy="47" r="4.8"/><circle cx="-70" cy="67" r="4.8"/>
      <circle cx="22" cy="96" r="4.8"/><circle cx="99" cy="-15" r="4.8"/>
    </g>
    <circle r="6" fill="#3f356f"/>
  </g>

  <path d="M278 139 C330 139 346 139 392 139" fill="none" stroke="#9a718f" stroke-width="2" marker-end="url(#arrow)" opacity="0.82"/>

  <g transform="translate(418 43)">
    <path d="M10 96 C74 21 140 171 204 96 S334 21 398 96" fill="none" stroke="url(#flow)" stroke-width="30" opacity="0.08" filter="url(#soft)"/>
    <g fill="none" stroke="url(#flow)" stroke-width="3.2" opacity="0.9">
      <path d="M8 96 C72 21 138 171 202 96 S332 21 396 96"/>
      <path d="M8 116 C72 41 138 191 202 116 S332 41 396 116" opacity="0.34"/>
    </g>
    <g fill="#fff" stroke-width="2.2">
      <circle cx="8" cy="96" r="8" stroke="#5942a9"/>
      <circle cx="58" cy="58" r="8" stroke="#6850a5"/>
      <circle cx="108" cy="102" r="8" stroke="#7c559d"/>
      <circle cx="158" cy="131" r="8" stroke="#935a91"/>
      <circle cx="208" cy="90" r="8" stroke="#a75e84"/>
      <circle cx="258" cy="58" r="8" stroke="#b96878"/>
      <circle cx="308" cy="108" r="8" stroke="#c1726b"/>
      <circle cx="396" cy="96" r="8" stroke="#c7835f"/>
    </g>
    <g stroke="#8d7b91" stroke-width="1" opacity="0.32">
      <line x1="32" y1="34" x2="32" y2="159"/><line x1="83" y1="34" x2="83" y2="159"/>
      <line x1="133" y1="34" x2="133" y2="159"/><line x1="183" y1="34" x2="183" y2="159"/>
      <line x1="233" y1="34" x2="233" y2="159"/><line x1="283" y1="34" x2="283" y2="159"/>
      <line x1="333" y1="34" x2="333" y2="159"/><line x1="371" y1="34" x2="371" y2="159"/>
    </g>
  </g>

  <path d="M826 139 C870 139 884 139 925 139" fill="none" stroke="#9a718f" stroke-width="2" marker-end="url(#arrow)" opacity="0.82"/>

  <g transform="translate(952 65)">
    <g fill="url(#flow)">
      <circle cx="0" cy="0" r="5"/><circle cx="27" cy="0" r="5"/><circle cx="54" cy="0" r="5"/><circle cx="81" cy="0" r="5"/>
      <circle cx="0" cy="27" r="5"/><circle cx="27" cy="27" r="5"/><circle cx="54" cy="27" r="5"/><circle cx="81" cy="27" r="5"/>
      <circle cx="0" cy="54" r="5"/><circle cx="27" cy="54" r="5"/><circle cx="54" cy="54" r="5"/><circle cx="81" cy="54" r="5"/>
      <circle cx="0" cy="81" r="5"/><circle cx="27" cy="81" r="5"/><circle cx="54" cy="81" r="5"/><circle cx="81" cy="81" r="5"/>
      <circle cx="0" cy="108" r="5"/><circle cx="27" cy="108" r="5"/><circle cx="54" cy="108" r="5"/><circle cx="81" cy="108" r="5"/>
      <circle cx="0" cy="135" r="5"/><circle cx="27" cy="135" r="5"/><circle cx="54" cy="135" r="5"/><circle cx="81" cy="135" r="5"/>
    </g>
    <path d="M103 0 v135" stroke="#8c7d8f" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.45"/>
    <g fill="#a2677e" opacity="0.42">
      <circle cx="125" cy="0" r="3.7"/><circle cx="125" cy="27" r="3.7"/><circle cx="125" cy="54" r="3.7"/>
      <circle cx="125" cy="81" r="3.7"/><circle cx="125" cy="108" r="3.7"/><circle cx="125" cy="135" r="3.7"/>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="155" y="280" font-size="18" font-weight="600" fill="#40394a">complete angular design</text>
    <text x="155" y="304" font-size="14" fill="#746d79">66,048 paired directions</text>
    <text x="620" y="280" font-size="18" font-weight="600" fill="#40394a">the realized network</text>
    <text x="620" y="304" font-size="14" fill="#746d79">32 fixed weight matrices</text>
    <text x="1015" y="280" font-size="18" font-weight="600" fill="#40394a">expected activations</text>
    <text x="1015" y="304" font-size="14" fill="#746d79">256 values at every layer</text>
  </g>
</svg>
